[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trillscope"
version = "1.0.0"
description = "Closure-based detection and multi-corpus acoustic analysis of the Spanish trill /r/"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mateo Cámara", email = "mateo.camara.largo@alumnos.upm.es" }]
requires-python = ">=3.11"
keywords = ["Spanish", "trill", "rhotics", "phonetics", "speech", "acoustic analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "Pillow>=10.0",
    "librosa>=0.10",
    "praat-parselmouth>=0.4.3",
    "soundfile>=0.12",
    "pydub>=0.25",
    "praatio>=6.0",
    "chardet>=5.0",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scikit-posthocs>=0.8",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Repository = "https://github.com/MateoCamara/trillscope"

[project.scripts]
trillscope = "trillscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trillscope*"]

[tool.setuptools.package-data]
trillscope = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
