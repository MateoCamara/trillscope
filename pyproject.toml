[project]
name = "trillscope"
version = "0.1.0"
description = "Spanish trill /r/ closure detection and multi-corpus acoustic analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "librosa>=0.10",
    "praat-parselmouth>=0.4.3",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trillscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
