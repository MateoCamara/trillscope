# Corpus inclusion/exclusion policy for IberSpeech 2026 submission.
# Rationale per corpus follows from the audit in the plan (Phase C).

corpora:
  DIMEx100:
    include: true
    role: "primary"
    weight_in_aggregate: "natural"     # also reported with corpus-equal weights
    notes: |
      Read corpus with native .phn alignment. The periodicity quality filter
      removes the large majority of its tokens, so in the analysed set it is a
      minor contributor (~2.3%). Excluded from sex comparisons: it has no sex
      metadata, and F0-inferred sex would be circular for F0-linked measures.

  ALBAYZIN:
    include: true
    role: "anchor_native_alignment"

  Glissando:
    include: true
    role: "anchor_native_alignment"

  PRESEEA:
    include: true
    role: "spontaneous_peninsular"

  TEDx:
    include: true
    role: "spontaneous_pan_hispanic"
    caveat: |
      Gender imbalanced toward male speakers. Sex-related aggregates must
      either weight by speaker or drop TEDx from gender analyses.

  Heroico:
    include: true
    role: "varied_read_speech"
    filters:
      keep_only_native: true   # drop the West Point non-native subset

  CommonVoice:
    include: true
    role: "crowdsourced_read"
    filters:
      min_snr_db: 15.0
      min_up_votes: 2
      require_no_down_votes: true

  M-AILABS:
    include: false
    reason: |
      Audiobook-derived material (LibriVox/Project Gutenberg). Style not
      representative of either controlled lab speech or natural conversation;
      prosody is dramatic-narrative. Dropped from the IberSpeech 2026 run.

# Token-level filters applied to every retained corpus
token_filters:
  min_duration_ms: 30.0
  max_duration_ms: 250.0
  min_voicing_pct: 5.0   # tokens with <5% voicing are likely mislabeled

# Aggregate reporting
reporting:
  speaker_level_means: true
  also_report_without_dimex100: true
  also_report_corpus_equal_weighted: true
  spontaneous_only_subset: ["PRESEEA", "TEDx", "Glissando"]
