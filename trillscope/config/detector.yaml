# Closure-detector parameters used for the published analysis.
# Keys mirror trillscope.detector.DetectorConfig; load with
# trillscope.detector.load_config().
# Physical constants are anchored in the trill phonetics literature:
#   - Closures ~ 15–30 ms; full cycles ~ 30–50 ms; trills ~ 50–120 ms.
#   - Each token is analysed with ±boundary_expand_ms of padding around its
#     aligned boundaries, which absorbs alignment error.

frame_ms: 2.5

low_band: [60.0, 500.0]
mid_band: [500.0, 3500.0]

min_inter_closure_ms: 25.0
max_inter_closure_ms: 50.0
closure_window_ms: 50.0
closure_threshold_pct: 0.40
closure_prominence_db: 5.0

release_min_lag_ms: 3.0
release_max_lag_ms: 25.0
release_threshold_pct: 0.40

enable_periodicity_refinement: true
period_z_threshold: 2.0

boundary_expand_ms: 20.0
